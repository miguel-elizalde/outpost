name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: extractions/setup-just@v3

      - name: TLA+ tools
        if: hashFiles('verify/tla/*.tla') != ''
        run: |
          jar="$RUNNER_TEMP/tla2tools.jar"
          curl -fsSL -o "$jar" https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $jar" | sha256sum -c -
          echo "TLA2TOOLS=$jar" >> "$GITHUB_ENV"

      - name: Lean
        if: hashFiles('verify/lean/lean-toolchain') != ''
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Kani
        run: |
          if [ -f Cargo.toml ] && git grep -q 'kani::proof' -- '*.rs'; then
            cargo install --locked kani-verifier
            cargo kani setup
          fi

      - run: just verify-formal
