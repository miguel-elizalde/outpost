name: mutants

on:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth-diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: changed
        run: |
          git branch -f main origin/main
          if git diff --quiet main -- apps/auth; then echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.changed.outputs.run == 'false'
        run: echo "No changes under apps/auth, no mutants to run."
      - if: steps.changed.outputs.run == 'true'
        uses: extractions/setup-just@v3
      - if: steps.changed.outputs.run == 'true'
        uses: arduino/setup-protoc@v3
        with:
          version: "36.x"
          repo-token: ${{ github.token }}
      - if: steps.changed.outputs.run == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - if: steps.changed.outputs.run == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - if: steps.changed.outputs.run == 'true'
        run: just auth-mutants-diff
      - if: always() && steps.changed.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: auth-mutants-diff
          path: mutants.out
          if-no-files-found: ignore

  key-diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: changed
        run: |
          git branch -f main origin/main
          if git diff --quiet main -- apps/key-provider/src; then echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.changed.outputs.run == 'false'
        run: echo "No changes under apps/key-provider/src, no mutants to run."
      - if: steps.changed.outputs.run == 'true'
        uses: extractions/setup-just@v3
      - if: steps.changed.outputs.run == 'true'
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - if: steps.changed.outputs.run == 'true'
        run: dotnet tool restore
      - if: steps.changed.outputs.run == 'true'
        run: just key-mutants-diff --threshold-high 100 --threshold-low 100 --break-at 100
      - if: always() && steps.changed.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: key-mutants-diff
          path: apps/key-provider/src/StrykerOutput
          if-no-files-found: ignore

  auth-full:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: extractions/setup-just@v3
      - uses: arduino/setup-protoc@v3
        with:
          version: "36.x"
          repo-token: ${{ github.token }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - run: just auth-mutants --shard ${{ matrix.shard }}/4
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-mutants-shard-${{ matrix.shard }}
          path: mutants.out
          if-no-files-found: ignore

  key-full:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: extractions/setup-just@v3
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet tool restore
      - run: just key-mutants
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: key-mutants
          path: apps/key-provider/src/StrykerOutput
          if-no-files-found: ignore
